version: '3.8'

services:
  discord-bot:
    build: .
    container_name: discord-music-bot
    restart: unless-stopped
    network_mode: "host"  # Use host network to avoid WebSocket issues
    environment:
      - DISCORD_TOKEN=${DISCORD_TOKEN}
      - COMMAND_PREFIX=${COMMAND_PREFIX:-!}
      - MAX_PLAYLIST_SIZE=${MAX_PLAYLIST_SIZE:-30}
      - AUDIO_FORMAT=${AUDIO_FORMAT:-bestaudio/best}
    volumes:
      - ./logs:/app/logs
      - bot_temp:/tmp/bot_audio
    env_file:
      - .env

    # Optional: Add resource limits
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

volumes:
  bot_temp:
    driver: local
