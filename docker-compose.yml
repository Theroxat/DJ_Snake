services:
  dj-snake:
    build: .
    image: dj-snake:latest
    container_name: dj-snake
    restart: unless-stopped
    # Reads DISCORD_TOKEN and the optional COMMAND_PREFIX / MAX_PLAYLIST_SIZE /
    # AUDIO_FORMAT variables from your local .env file (never committed).
    env_file:
      - .env
    depends_on:
      pot-provider:
        condition: service_healthy
    # Outbound bridge networking is enough for Discord voice (UDP) with the
    # current discord.py. If voice ever fails behind a restrictive NAT, you can
    # switch to the host network by uncommenting the next line.
    # network_mode: host

  # Proof-of-Origin token provider. YouTube challenges requests from datacenter
  # IPs ("Sign in to confirm you're not a bot"); yt-dlp answers with a PO token,
  # which this service mints. Not exposed on the host: only dj-snake needs it,
  # over the compose network at http://pot-provider:4416.
  pot-provider:
    image: brainicism/bgutil-ytdlp-pot-provider:1.3.2-deno
    container_name: dj-snake-pot-provider
    restart: unless-stopped
    expose:
      - "4416"
    # deno is the only HTTP client in this image (no curl, no wget).
    healthcheck:
      test:
        - CMD
        - deno
        - eval
        - "const r = await fetch('http://127.0.0.1:4416/ping'); Deno.exit(r.ok ? 0 : 1)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
