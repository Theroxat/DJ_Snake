version: '3.8'

services:
  discord-bot:
    build: .
    container_name: discord-music-bot
    restart: unless-stopped
    environment:
      - DISCORD_TOKEN=${DISCORD_TOKEN}
      - COMMAND_PREFIX=${COMMAND_PREFIX:-!}
      - MAX_PLAYLIST_SIZE=${MAX_PLAYLIST_SIZE:-30}
      - AUDIO_FORMAT=${AUDIO_FORMAT:-bestaudio/best}
      - TEMP_DIR=/app/temp
    volumes:
      - ./logs:/app/logs
      - ./temp:/app/temp
      - bot_temp:/tmp
    env_file:
      - .env
    networks:
      - discord-network

    # DNS configuration for better Discord connectivity
    dns:
      - 8.8.8.8
      - 1.1.1.1
      - 208.67.222.222

    # Security and capability options
    cap_add:
      - NET_ADMIN

    # Optional: Add resource limits
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

volumes:
  bot_temp:
    driver: local

networks:
  discord-network:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.enable_icc: "true"
      com.docker.network.bridge.enable_ip_masquerade: "true"
      com.docker.network.driver.mtu: "1500"
