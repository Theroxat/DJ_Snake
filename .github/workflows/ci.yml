name: CI/CD Pipeline

on:
    push:
        branches: [main, develop]
    pull_request:
        branches: [main]

jobs:
    test:
        runs-on: ubuntu-latest
        strategy:
            matrix:
                python-version: [3.8, 3.9, "3.10", 3.11]

        steps:
            - uses: actions/checkout@v4

            - name: Set up Python ${{ matrix.python-version }}
              uses: actions/setup-python@v4
              with:
                  python-version: ${{ matrix.python-version }}

            - name: Install system dependencies
              run: |
                  sudo apt-get update
                  sudo apt-get install -y ffmpeg

            - name: Install Python dependencies
              run: |
                  python -m pip install --upgrade pip
                  pip install -r requirements.txt
                  pip install pytest black flake8

            - name: Lint with flake8
              run: |
                  # Stop the build if there are Python syntax errors or undefined names
                  flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
                  # Exit-zero treats all errors as warnings
                  flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

            - name: Format check with black
              run: |
                  black --check --diff .

            - name: Test bot import
              run: |
                  python -c "import bot; print('Bot import successful')"

            - name: Test bot configuration
              run: |
                  python -c "
                  import bot
                  import os
                  # Test environment variable handling
                  print('Configuration test successful')
                  "

    security-scan:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Run security scan
              uses: securecodewarrior/github-action-add-sarif@v1
              with:
                  sarif-file: "security-scan-results.sarif"
              continue-on-error: true

    docker-build:
        runs-on: ubuntu-latest
        needs: test
        if: github.ref == 'refs/heads/main'

        steps:
            - uses: actions/checkout@v4

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Build Docker image
              run: |
                  docker build -t discord-music-bot:latest .

            - name: Test Docker image
              run: |
                  docker run --rm discord-music-bot:latest python -c "import bot; print('Docker build successful')"
