name: CI/CD Pipeline

on:
    push:
        branches: [main, develop]
    pull_request:
        branches: [main]

jobs:
    test:
        runs-on: ubuntu-latest
        strategy:
            matrix:
                python-version: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]

        steps:
            - uses: actions/checkout@v7

            - name: Set up Python ${{ matrix.python-version }}
              uses: actions/setup-python@v7
              with:
                  python-version: ${{ matrix.python-version }}

            - name: Install system dependencies
              run: |
                  sudo apt-get update
                  sudo apt-get install -y ffmpeg

            - name: Install Python dependencies
              run: |
                  python -m pip install --upgrade pip
                  pip install -r requirements-dev.txt

            - name: Lint with flake8
              run: |
                  # Stop the build if there are Python syntax errors or undefined names
                  flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
                  # Exit-zero treats all errors as warnings
                  flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

            - name: Format check with black
              run: |
                  black --check --diff .

            - name: Test bot import and basic functionality
              run: |
                  python -c "
                  import bot
                  import discord
                  print('✅ Bot import successful')
                  print('✅ Discord.py version:', discord.__version__)
                  print('✅ Bot configuration loaded')
                  print('✅ All core modules accessible')
                  "

            - name: Run tests
              run: |
                  pytest -q

    docs:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7

            - name: Set up Python
              uses: actions/setup-python@v7
              with:
                  python-version: "3.13"

            - name: Install documentation dependencies
              run: |
                  python -m pip install --upgrade pip
                  pip install -r docs/requirements.txt

            - name: Build documentation (warnings are errors)
              run: |
                  sphinx-build -W --keep-going -b html docs/source docs/_build/html

    security-scan:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7

            - name: Set up Python
              uses: actions/setup-python@v7
              with:
                  python-version: "3.12"

            - name: Install security tools
              run: |
                  pip install bandit safety

            - name: Run Bandit security scan
              run: |
                  bandit -r . -f json -o bandit-report.json || true

            - name: Run Safety dependency scan
              run: |
                  safety check --json --output safety-report.json || true

            - name: Upload security scan results
              uses: actions/upload-artifact@v7
              with:
                  name: security-reports
                  path: |
                      bandit-report.json
                      safety-report.json
              if: always()

    docker-build:
        runs-on: ubuntu-latest
        needs: test
        if: github.ref == 'refs/heads/main'

        steps:
            - uses: actions/checkout@v7

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v4

            - name: Build Docker image
              run: |
                  docker build -t discord-music-bot:latest .

            - name: Test Docker image
              run: |
                  docker run --rm discord-music-bot:latest python -c "import bot; print('Docker build successful')"
