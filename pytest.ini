[pytest]
testpaths = tests
pythonpath = .
# The end-to-end tests are slower and need ffmpeg (and Chromium for the web
# ones): `pytest` skips them, `pytest -m e2e` runs only them.
addopts = -m "not e2e"
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
markers =
    ffmpeg: runs the real ffmpeg binary (skipped when it is not installed)
    e2e: end-to-end test (real ffmpeg, real web app in Chromium); run with -m e2e
filterwarnings =
    ignore:'audioop' is deprecated:DeprecationWarning
